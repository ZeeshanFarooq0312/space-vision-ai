detection:
  weights: models/yolov8n.pt
  device: auto
  conf_threshold: 0.5
  iou_threshold: 0.45

tracking:
  tracker: passthrough  # "tracktrack" for real Kalman+ReID tracking (fixed cameras only, see
                         # tracking/local_tracker.py)
  det_thr: 0.6
  init_thr: 0.6
  match_thr: 0.7
  max_time_lost_seconds: 3.0

identity:
  face_match_threshold: 0.55
  body_match_threshold: 0.45

attendance:
  presence_confirmation_seconds: 8
  end_of_day_auto_logout_time: "23:59"
