services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: visionstack
      POSTGRES_PASSWORD: visionstack
      POSTGRES_DB: visionstack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionstack"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://visionstack:visionstack@postgres:5432/visionstack
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    # Live-preview (Phase 1-2 webcam capture) needs the host webcam device inside the
    # container. Adjust/add entries here to match whatever /dev/video* exists on the host.
    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

  inference:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: docker/inference.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://visionstack:visionstack@postgres:5432/visionstack
    volumes:
      - ./models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - postgres

volumes:
  pgdata:
